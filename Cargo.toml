[package]
name = "nats-showcase"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A guided tour of the NATS messaging system from Rust, using the official async-nats client"
publish = false

[dependencies]
anyhow = "1"
async-nats = "0.50"
bytes = "1"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
