# A single-node NATS server with JetStream enabled, which every demo in this
# project needs. Start it with `docker compose up -d`.
services:
  nats:
    image: nats:2.14-alpine
    command:
      - "--name=showcase"
      - "--jetstream"
      - "--store_dir=/data"
      - "--http_port=8222"
    ports:
      - "4222:4222" # client connections
      - "8222:8222" # HTTP monitoring, e.g. http://localhost:8222/jsz
    volumes:
      - nats-data:/data

volumes:
  nats-data:
